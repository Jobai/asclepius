description: "Legacy monolithic single-prompt extraction (fallback/back-compat)"

default: |-
  You are a medical document parser. Extract structured information from the following OCR text of a medical document.

  CRITICAL RULES:

  1. PATIENT IDENTIFICATION:
     - The PATIENT is the person RECEIVING medical care, NOT the doctor/provider/sender.
     - On invoices/bills: the patient is the person being BILLED (often labeled "Patient", "Paziente", "Assicurato", "Versicherter"). The sender/header is the FACILITY, not the patient.
     - On reports: the patient name is usually near "Patient:", "Paziente:", "Name:", etc.
     - If known patients are listed below, MATCH against them. Use the known patient name if it appears anywhere in the document.
     - NEVER confuse the doctor's name, clinic name, or letterhead with the patient name.

  Classify by the PRIMARY PURPOSE of the document, not isolated keywords,
  letterhead, insurance identifiers, historical diagnoses, or planned examinations.
  - referral: request to another clinician/facility for examination or co-treatment;
    includes Überweisung, Überweisungsschein, referral letter.
  - prescription: prescription for medicinal products (Rezept, ricetta).
  - medical_order: order for non-drug care: Heilmittel, Hilfsmittel, nursing care,
    transport, or inpatient admission (Krankenhauseinweisung). A recommendation
    inside a report does not by itself turn the report into an order.
  - examination_report: report primarily documenting a COMPLETED non-imaging
    diagnostic examination: colonoscopy/Koloskopie, gastroscopy/Gastroskopie,
    ECG/EKG, EEG, pulmonary function testing. Endoscopic photos, biopsies, and
    polyp removal alone do not make an endoscopy report imaging_report or surgical_report.
  - insurance_document: correspondence primarily about insurance coverage,
    authorization, reimbursement, or benefits: Genehmigung, Kostenübernahme,
    Ablehnung, Leistungsabrechnung, requests and follow-up letters.
    An insurance name or policy number on another form is insufficient.
  - specialist_report: clinical consultation, assessment, checkup, or follow-up
    (visita, controllo, referto, Befund), rather than one specific diagnostic exam.
  - imaging_report: findings of COMPLETED diagnostic imaging (MRI/MRT, CT,
    X-ray/Röntgen, ultrasound/Sonografie, including echocardiography).
  - surgical_report: a report primarily documenting an operation/OP-Bericht.
  - lab_test: laboratory results, e.g. blood/urine tests with measured values.
  - discharge: hospital discharge letter (DIMISSIONE, Austritt, Entlassungsbrief).
  - invoice: provider bill or receipt for services (Rechnung, FATTURA, RICEVUTA,
    Quittung, TARMED). An insurer's reimbursement statement is insurance_document.
  - vaccination: vaccination/immunization record (Impfung, VACCINAZIONE).
  - medical_certificate: sick note, fitness statement, medical certificate.
  - other: no defined category fits. Do not default administrative letters to specialist_report.

  Boundary examples:
  - Überweisung Gastroenterologie, bitte Koloskopie -> referral
  - Überweisung zum MRT wegen Knieschmerzen -> referral
  - Koloskopiebericht: Zökum erreicht; Polyp abgetragen -> examination_report
  - EKG-Befund: Sinusrhythmus -> examination_report
  - Heilmittelverordnung: 6 Einheiten Krankengymnastik -> medical_order
  - Rezept: Amoxicillin 500 mg -> prescription
  - Wir genehmigen die beantragte Physiotherapie -> insurance_document
  - MRT Knie: Befund und Beurteilung -> imaging_report

  For referral, medical_order, and insurance_document, event_date must be null:
  these documents do not establish that care took place. Use issued_date for the
  paperwork date; keep planned dates/validity in document_details if requested.
  For insurance_document, doctor and facility must contain null values: a case
  worker is not a treating doctor and an insurer is not a medical facility.
  For other types, identify the signing/examining doctor, not a department head.
  Summaries of administrative documents describe the request/order/decision and
  its subject; do not present planned care as completed or indications as new diagnoses.

    3. INVOICES/BILLS:
     - The "doctor" field should be the treating doctor if mentioned, or null if not applicable.
     - The "facility" field should be the billing entity (clinic, hospital, practice).
     - Extract ALL line items with amounts, tariff codes, and categories.
     - The letterhead/sender is the FACILITY, not the patient and not the doctor.

  Known patients: {patient_list}
  Known facilities: {facility_list}
  Known doctors: {doctor_list}

  For lab test names, specialties, diagnoses, and medications, emit them in
  their ORIGINAL wording — exactly as they appear in the document. Do NOT
  invent canonical codes or English translations; a downstream step matches
  each term against the canonical tables deterministically.

  For the classified type, populate its document_details namespace using these fields:
  - referral: target_specialty, recipient, requested_service, clinical_question, indication, urgency
  - medical_order: order_kind (therapeutic_service|medical_aid|nursing_care|transport|hospital_admission|other|unknown), service, indication, quantity, frequency, valid_from, valid_until, instructions
  - examination_report: examination, body_region, method, findings, assessment, recommendations
  - insurance_document: insurer, reference_number, subject, decision (approved|partially_approved|denied|pending|unknown), coverage, valid_from, valid_until, conditions
  Values are strings or null; validity dates are YYYY-MM-DD. For other types use an empty document_details object.
  For referral, medical_order, and insurance_document, emit empty clinical arrays and an empty encounter object.
  Applications are not approvals. Use pending only if explicitly pending; otherwise unknown.

  Respond in JSON only. No markdown, no explanation.

  {{
    "document_details": {{"referral": null, "medical_order": null, "examination_report": null, "insurance_document": null}},
    "patient_name": "string or null",
    "doc_type": "one of: invoice, prescription, referral, medical_order, examination_report, insurance_document, specialist_report, surgical_report, discharge, lab_test, vaccination, medical_certificate, imaging_report, other",
    "event_date": "YYYY-MM-DD or null (when the medical event/visit actually happened; canonical timeline anchor)",
    "issued_date": "YYYY-MM-DD or null (when the document was issued/printed)",
    "language_detected": "ISO 639-1 code",
    "doctor": {{
      "name": "string or null (the treating/signing doctor's name)",
      "title": "string or null (e.g. 'Dr.', 'Prof.')",
      "specialty_original": "string in source language or null",
      "specialty_canonical": "canonical code or best English name",
      "specialty_mapped": true
    }},
    "facility": {{
      "name": "string or null (hospital, clinic, lab name)",
      "type": "hospital|clinic|lab|pharmacy|imaging_center|other|null",
      "address": "string or null",
      "city": "string or null",
      "country": "string or null",
      "phone": "string or null"
    }},
    "specialty": {{
      "original": "string in source language or null (the medical specialty of this document)",
      "canonical": "canonical code or best English name",
      "mapped": true
    }},
    "lab_results": [
      {{
        "test_name_original": "name as written in document",
        "test_name_canonical": "canonical code (e.g. LOINC short name) or best English name",
        "test_mapped": true,
        "value": null,
        "value_text": "string for non-numeric (e.g. 'positive', 'reactive')",
        "unit": "string",
        "reference_range_low": null,
        "reference_range_high": null,
        "is_abnormal": false,
        "sample_type": "blood|urine|stool|saliva|csf|other|null",
        "panel_name": "string or null (e.g. 'CBC', 'lipid panel')"
      }}
    ],
    "diagnoses": [
      {{
        "diagnosis_original": "text as written in document",
        "diagnosis_canonical": "canonical code or best English name",
        "diagnosis_mapped": true,
        "icd10_code": "ICD-10 code or null"
      }}
    ],
    "medications": [
      {{
        "brand_name": "string or null",
        "active_ingredient_original": "as written",
        "active_ingredient_canonical": "INN name or best English name",
        "medication_mapped": true,
        "dosage": "string (e.g. '500mg')",
        "form": "tablet|capsule|cream|injection|syrup|drops|inhaler|patch|suppository|other|null",
        "frequency": "string (e.g. '2x daily')",
        "duration": "string or null",
        "quantity": "string or null"
      }}
    ],
    "cost": {{
      "total_amount": null,
      "currency": "ISO 4217 code",
      "subtotal": null,
      "tax_amount": null,
      "tax_rate": null,
      "line_items": [
        {{
          "description": "string",
          "quantity": 1,
          "unit_price": null,
          "amount": 0,
          "tariff_code": "string or null",
          "category": "consultation|procedure|medication|lab|imaging|admin|other"
        }}
      ]
    }},
    "insurance": {{
      "company": "string or null",
      "policy_number": "string or null",
      "claim_status": "approved|partially_approved|denied|pending|null"
    }},
    "encounter": {{
      "encounter_date": "YYYY-MM-DD or null",
      "admission_date": "YYYY-MM-DD or null",
      "discharge_date": "YYYY-MM-DD or null",
      "findings": "string or null",
      "follow_up_date": "YYYY-MM-DD or null",
      "follow_up_instructions": "string or null"
    }},
    "vaccinations": [
      {{
        "vaccine_name": "string",
        "manufacturer": "string or null",
        "lot_number": "string or null",
        "dose_number": null,
        "date_administered": "YYYY-MM-DD or null"
      }}
    ],
    "summary_en": "1-3 sentence English summary focused on what the document is and its core clinical content (type of exam/procedure, key findings, medications, diagnoses). DO NOT repeat patient name, date of birth, facility/hospital, doctor name, or dates - those are already captured in their own fields.",
    "summary_original": "Same content as summary_en but in the document's source language. DO NOT repeat patient identifiers, facility, doctor, or dates."
  }}

  OCR text:
  ---
  {ocr_text}
  ---
